name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh baked-in skill ratings (positive reaction counts) once a day even
  # when there are no code pushes, so "Top rated" sort stays current. The build
  # and deploy only run when the counts actually changed, so quiet days don't
  # produce a redundant no-op deployment (see the "Fetch skill ratings" step).
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write # commit the refreshed ratings snapshot back to main
  discussions: read

# Allow one concurrent deployment, skipping runs queued between in-progress and latest.
concurrency:
  group: azure-static-web-apps
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.ratings.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch skill ratings
        id: ratings
        run: |
          npm run ratings:fetch
          if git diff --quiet -- src/data/ratings.json; then
            changed=false
          else
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          # Always build/deploy on code pushes and manual runs; on the daily
          # cron, only when the reaction counts actually changed.
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$changed" = "true" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "No rating changes on scheduled run; skipping build and deploy."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Persist refreshed ratings
        if: steps.ratings.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ratings.json
          git commit -m "chore(ratings): refresh skill reaction counts"
          # A GITHUB_TOKEN push does not retrigger workflows, so this run still
          # owns the deploy below; the commit only keeps tomorrow's diff stable.
          git push || echo "::warning::Could not push refreshed ratings; will retry next run."
      # Regenerate every skill page + bundle from submissions/ before building.
      # PR CI only commits generated content back to SAME-REPO PR branches; fork
      # PRs are validate-only, so their src/content/skills/<slug>.md never lands
      # on main and the skill would 404 / be missing from the gallery. Importing
      # here makes the deployed site reflect submissions/ regardless of how a PR
      # was merged. Idempotent: it rewrites the same files a same-repo PR did.
      - name: Import skill submissions
        if: steps.ratings.outputs.should_deploy == 'true'
        run: npm run import:submissions -- --copilot-studio-output "$RUNNER_TEMP/copilot-studio-skills"
      - name: Build
        if: steps.ratings.outputs.should_deploy == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build
      - name: Publish Copilot Studio skill branch
        if: steps.ratings.outputs.should_deploy == 'true'
        env:
          FEED_BRANCH: copilot-studio-skills
          FEED_DIR: ${{ runner.temp }}/copilot-studio-skills
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/copilot-studio-publish"

          if git ls-remote --exit-code --heads origin "$FEED_BRANCH" >/dev/null; then
            git fetch origin "refs/heads/$FEED_BRANCH:refs/remotes/origin/$FEED_BRANCH"
            git worktree add --detach "$publish_dir" "origin/$FEED_BRANCH"
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" switch --orphan "$FEED_BRANCH"
          fi

          rsync -a --delete --exclude=".git" "$FEED_DIR/" "$publish_dir/"
          git -C "$publish_dir" add -A

          if git -C "$publish_dir" diff --cached --quiet; then
            echo "Copilot Studio skill branch is current."
            exit 0
          fi

          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" commit -m "chore: refresh Copilot Studio skill feed"
          git -C "$publish_dir" push origin "HEAD:refs/heads/$FEED_BRANCH"
      - name: Upload site artifact
        if: steps.ratings.outputs.should_deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: azure-static-web-apps
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: upload
          app_location: dist
          skip_app_build: true
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
